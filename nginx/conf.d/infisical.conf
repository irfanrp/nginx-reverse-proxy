# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name infisical.aboutdevops.my.id;
    include /etc/nginx/snippets/redirect-https.conf;
}

# HTTPS - infisical.aboutdevops.my.id
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name infisical.aboutdevops.my.id;

    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/security-headers.conf;

    resolver 127.0.0.11 valid=5s;

    location = / {
        return 301 /login;
    }

    location / {
        set $upstream http://infisical-backend:8080;
        # Strip stale browser-cached Basic auth (dari /metrics lama) — app cuma pake Bearer
        set $authz $http_authorization;
        if ($http_authorization ~* "^Basic\s") {
            set $authz "";
        }
        proxy_set_header Authorization $authz;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/snippets/proxy-params.conf;
    }
}
